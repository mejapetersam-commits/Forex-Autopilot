name: Backend tests

on:
  push:
    branches: [main, feature/bulk-candle-ingestion]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "mt5/**"
      - "trading-engine/**"
      - "config/**"
      - ".github/workflows/backend-tests.yml"
      - "docker-compose.yml"
      - ".dockerignore"
      - "README.md"
      - "documentation/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "mt5/**"
      - "trading-engine/**"
      - "config/**"
      - ".github/workflows/backend-tests.yml"
      - "docker-compose.yml"
      - ".dockerignore"
      - "README.md"
      - "documentation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v

      - name: Build API container
        working-directory: .
        run: docker build -f backend/Dockerfile -t forex-autopilot-api:test backend

      - name: Validate Docker Compose configuration
        working-directory: .
        env:
          FOREX_AUTOPILOT_BRIDGE_TOKEN: ci-placeholder-token-that-is-not-used-for-trading
        run: docker compose config --quiet

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dashboard dependencies
        run: npm install

      - name: Build dashboard
        run: npm run build
