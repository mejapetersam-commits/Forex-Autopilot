worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    upstream forex_autopilot_api {
        server api:8000;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        # Only the three authenticated, read-only telemetry ingestion routes
        # are reachable through this gateway. All other paths are denied.
        location = /api/v1/mt5/heartbeat {
            limit_except POST { deny all; }
            if ($content_type !~* "^application/json(?:\s*;.*)?$") { return 415; }
            proxy_pass http://forex_autopilot_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /api/v1/mt5/account {
            limit_except POST { deny all; }
            if ($content_type !~* "^application/json(?:\s*;.*)?$") { return 415; }
            proxy_pass http://forex_autopilot_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /api/v1/mt5/quote {
            limit_except POST { deny all; }
            if ($content_type !~* "^application/json(?:\s*;.*)?$") { return 415; }
            proxy_pass http://forex_autopilot_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            return 404;
        }
    }
}
