services:
  telemetry-volume-init:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - telemetry_data:/data
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "10001:10001"
    depends_on:
      telemetry-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      APP_ENV: production
      FOREX_AUTOPILOT_BRIDGE_TOKEN: ${FOREX_AUTOPILOT_BRIDGE_TOKEN:?Set a strong bridge token in the deployment environment}
      FOREX_AUTOPILOT_TELEMETRY_DB: /var/lib/forex-autopilot/telemetry.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - telemetry_data:/var/lib/forex-autopilot
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  telemetry_data:
